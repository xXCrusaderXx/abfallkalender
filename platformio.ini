; PlatformIO Projektkonfiguration
; Board: Sunton ESP32-2432S032C-I ("Cheap Yellow Display v2", 3.2", ST7789 + GT911 kapazitiv)
; Referenz-Pinout (Board-Definition, verifiziert): rzeldent/platformio-espressif32-sunton,
; esp32-2432S032C.json - https://github.com/rzeldent/platformio-espressif32-sunton
; Display-Reset ist NICHT verdrahtet (GPIO_NUM_NC) - TFT_RST=-1 ist daher korrekt, kein Bug.
; GT911-Touch-Reset liegt an GPIO 25 (nicht ueber TFT_eSPI, siehe display_ui.cpp).

[env:esp32-2432S032C]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@^8.3.11
    tamctec/TAMC_GT911@^1.0.2

; TFT_eSPI wird ohne eigene User_Setup.h konfiguriert - alle Einstellungen
; kommen als Compiler-Defines rein (Standardvorgehen fuer PlatformIO-Projekte
; mit dieser Display-Bibliothek).
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=13
    -DTFT_MISO=12
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=27
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -I include
