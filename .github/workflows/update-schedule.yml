name: Abfuhrtermine aktualisieren

# Haelt data/schedule.json aktuell, indem taeglich die echten Termine von
# app.abfallplus.de (Backend der offiziellen "Abfall LK BZ"-App) geladen
# werden. Der ESP32 fragt diese Datei per HTTPS ab (siehe src/waste_schedule.cpp)
# - so muss nach jaehrlicher Kalenderaktualisierung nichts mehr manuell aus dem
# PDF abgetippt oder neu geflasht werden.
on:
  schedule:
    - cron: "17 3 * * *" # taeglich 03:17 UTC, abseits der ueblichen volle-Stunde-Last
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - run: python scripts/fetch_schedule.py

      - name: Commit falls sich etwas geaendert hat
        run: |
          if git diff --quiet -- data/schedule.json; then
            echo "Keine Aenderungen an den Terminen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          git commit -m "Abfuhrtermine automatisch aktualisiert"
          git push
